    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // --- BIẾN TOÀN CỤC ---
        let scene, camera, renderer, controls, composer, bloomPass;
        let mechRoot, bodyGroup, eyeAssembly, topAntennaGroup, topFinMesh;
        let legSystems = [];
        let pistonPairs = [];
        let materials = {};
        let dirLight, clock = new THREE.Clock();

        const state = {
            morphSphere: false,
            morphProgress: 0, // 0 = dáng nhện đứng, 1 = thu gọn thành cầu
            idleActive: true,
            glowIntensity: 1.8,
            envIntensity: 1.15
        };

        // Góc camera chuẩn giống hệt ảnh tham chiếu
        const DEFAULT_CAM_POS = new THREE.Vector3(-1.35, 1.85, 4.15);
        const DEFAULT_CAM_TARGET = new THREE.Vector3(0.0, 1.05, 0.0);

        /**
         * Tạo Procedural Textures cho lớp giáp:
         * - Albedo Map: Sơn trắng xám, dải đỏ chiến thuật quanh mắt & vai, vết xước tróc sơn lộ kim loại
         * - Roughness Map: Sơn mờ vs kim loại trầy xước bóng hơn
         * - Bump Map: Rãnh khắc chìm (panel lines) & độ lồi lõm vết xước
         */
        function createArmorTextures() {
            const width = 1024;
            const height = 1024;

            const albedoCanvas = document.createElement('canvas');
            albedoCanvas.width = width;
            albedoCanvas.height = height;
            const aCtx = albedoCanvas.getContext('2d');

            const roughCanvas = document.createElement('canvas');
            roughCanvas.width = width;
            roughCanvas.height = height;
            const rCtx = roughCanvas.getContext('2d');

            const bumpCanvas = document.createElement('canvas');
            bumpCanvas.width = width;
            bumpCanvas.height = height;
            const bCtx = bumpCanvas.getContext('2d');

            // 1. Nền sơn trắng xám nhám quân sự
            aCtx.fillStyle = '#cfcfd2';
            aCtx.fillRect(0, 0, width, height);

            rCtx.fillStyle = '#888888'; // Độ nhám trung bình cho sơn
            rCtx.fillRect(0, 0, width, height);

            bCtx.fillStyle = '#808080';
            bCtx.fillRect(0, 0, width, height);

            // Nhiễu hạt nhẹ bề mặt kim loại đúc
            for (let i = 0; i < 6000; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const s = 1 + Math.random() * 2;
                aCtx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.04)' : 'rgba(60,60,65,0.04)';
                aCtx.fillRect(x, y, s, s);
            }

            // 2. Họa tiết dải sơn đỏ tươi (Tactical Red Stripes)
            // Trên SphereGeometry UV: u = 0.25 là mặt trước (+Z), v = 0.5 là xích đạo
            aCtx.fillStyle = '#c42222';
            rCtx.fillStyle = '#6e6e6e'; // Sơn đỏ hơi bóng hơn sơn trắng một chút

            // Dải vòng cung đỏ lớn bao quanh hốc mắt ở mặt trước (u ~ 0.25)
            const drawRedArc = (cx, cy, rOuter, rInner) => {
                [aCtx, rCtx].forEach((ctx, idx) => {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(cx, cy, rOuter, 0, Math.PI * 2);
                    ctx.arc(cx, cy, rInner, 0, Math.PI * 2, true);
                    ctx.fill();
                    ctx.restore();
                });
            };

            // Vòng đỏ quanh mặt trước (u=0.25 -> x=256, y=540)
            drawRedArc(width * 0.25, height * 0.53, 215, 138);

            // Dải đỏ kéo ngang sang hai bên hông (vòng quanh thân)
            aCtx.fillRect(0, height * 0.49, width, 46);
            rCtx.fillRect(0, height * 0.49, width, 46);

            // 3. Các đường rãnh khắc chìm trên vỏ giáp (Engraved Panel Lines)
            const drawPanelLine = (x1, y1, x2, y2, lw = 3) => {
                bCtx.strokeStyle = '#252525';
                bCtx.lineWidth = lw;
                bCtx.beginPath();
                bCtx.moveTo(x1, y1);
                bCtx.lineTo(x2, y2);
                bCtx.stroke();

                aCtx.strokeStyle = 'rgba(45, 45, 50, 0.55)';
                aCtx.lineWidth = lw * 0.75;
                aCtx.beginPath();
                aCtx.moveTo(x1, y1);
                aCtx.lineTo(x2, y2);
                aCtx.stroke();
            };

            // Đường chia mảng dọc và chéo trên thân cầu
            for (let i = 0; i < 8; i++) {
                const lx = (width / 8) * i;
                drawPanelLine(lx, 120, lx, 900, 3);
            }
            drawPanelLine(0, 310, width, 310, 3.5);
            drawPanelLine(0, 710, width, 710, 3.5);

            // 4. Vết trầy xước sơn chiến đấu (Battle-worn Chipping & Scratches)
            const addScratchCluster = (cx, cy, count, spreadX, spreadY, maxSize) => {
                for (let i = 0; i < count; i++) {
                    const sx = cx + (Math.random() - 0.5) * spreadX;
                    const sy = cy + (Math.random() - 0.5) * spreadY;
                    const sw = 2 + Math.random() * maxSize;
                    const sh = 1.5 + Math.random() * (maxSize * 0.6);
                    const angle = (Math.random() - 0.5) * 1.4;

                    // Lộ lớp thép tối màu bên dưới lớp sơn
                    aCtx.save();
                    aCtx.translate(sx, sy);
                    aCtx.rotate(angle);
                    aCtx.fillStyle = Math.random() > 0.3 ? '#4b4d52' : '#63666c';
                    aCtx.fillRect(-sw / 2, -sh / 2, sw, sh);
                    aCtx.restore();

                    // Kim loại trầy bóng hơn sơn (roughness tối = bóng)
                    rCtx.save();
                    rCtx.translate(sx, sy);
                    rCtx.rotate(angle);
                    rCtx.fillStyle = '#333333';
                    rCtx.fillRect(-sw / 2, -sh / 2, sw, sh);
                    rCtx.restore();

                    // Lõm nhẹ trên bump map
                    bCtx.save();
                    bCtx.translate(sx, sy);
                    bCtx.rotate(angle);
                    bCtx.fillStyle = '#4a4a4a';
                    bCtx.fillRect(-sw / 2, -sh / 2, sw, sh);
                    bCtx.restore();
                }
            };

            // Tập trung nhiều vết xước ở phần cằm dưới mắt (giống hệt ảnh mẫu!)
            addScratchCluster(width * 0.25, height * 0.67, 95, 140, 65, 16);
            // Vết xước ở mép khe trên đỉnh đầu và trán
            addScratchCluster(width * 0.22, height * 0.27, 65, 160, 70, 14);
            addScratchCluster(width * 0.31, height * 0.32, 55, 120, 60, 12);
            // Vết xước rải rác trên các mảng giáp sườn & chân
            for (let k = 0; k < 14; k++) {
                addScratchCluster(Math.random() * width, 200 + Math.random() * 620, 28, 90, 70, 11);
            }

            const albedoMap = new THREE.CanvasTexture(albedoCanvas);
            albedoMap.colorSpace = THREE.SRGBColorSpace;
            albedoMap.wrapS = THREE.RepeatWrapping;
            albedoMap.wrapT = THREE.ClampToEdgeWrapping;

            const roughnessMap = new THREE.CanvasTexture(roughCanvas);
            roughnessMap.wrapS = THREE.RepeatWrapping;
            roughnessMap.wrapT = THREE.ClampToEdgeWrapping;

            const bumpMap = new THREE.CanvasTexture(bumpCanvas);
            bumpMap.wrapS = THREE.RepeatWrapping;
            bumpMap.wrapT = THREE.ClampToEdgeWrapping;

            return { albedoMap, roughnessMap, bumpMap };
        }

        /**
         * Texture riêng cho tấm giáp chân (Trắng xám + mảng sơn đỏ ở đầu gối + vết xước)
         */
        function createLegArmorTextures() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const bCanvas = document.createElement('canvas');
            bCanvas.width = 512;
            bCanvas.height = 512;
            const bCtx = bCanvas.getContext('2d');

            ctx.fillStyle = '#d1d1d4';
            ctx.fillRect(0, 0, 512, 512);
            bCtx.fillStyle = '#808080';
            bCtx.fillRect(0, 0, 512, 512);

            // Mảng sơn đỏ nổi bật ở phần trên (gần khớp gối)
            ctx.fillStyle = '#c42222';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(512, 0);
            ctx.lineTo(512, 165);
            ctx.quadraticCurveTo(256, 210, 0, 150);
            ctx.closePath();
            ctx.fill();

            // Đường rãnh giáp trên chân
            bCtx.strokeStyle = '#282828';
            bCtx.lineWidth = 4;
            bCtx.beginPath();
            bCtx.moveTo(0, 240);
            bCtx.lineTo(512, 260);
            bCtx.stroke();

            ctx.strokeStyle = 'rgba(40,40,45,0.45)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(0, 240);
            ctx.lineTo(512, 260);
            ctx.stroke();

            // Vết xước tróc sơn dọc mép giáp chân
            for (let i = 0; i < 140; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const w = 2 + Math.random() * 12;
                const h = 1.5 + Math.random() * 6;
                ctx.fillStyle = '#4e5056';
                ctx.fillRect(x, y, w, h);
                bCtx.fillStyle = '#484848';
                bCtx.fillRect(x, y, w, h);
            }

            const map = new THREE.CanvasTexture(canvas);
            map.colorSpace = THREE.SRGBColorSpace;
            const bump = new THREE.CanvasTexture(bCanvas);
            return { map, bump };
        }

        /**
         * Bóng tiếp xúc mềm dưới sàn studio
         */
        function createContactShadowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const drawBlob = (x, y, rx, ry, alpha) => {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(rx, ry);
                const g = ctx.createRadialGradient(0, 0, 0.08, 0, 0, 1);
                g.addColorStop(0, `rgba(15, 15, 18, ${alpha})`);
                g.addColorStop(0.6, `rgba(20, 20, 24, ${alpha * 0.45})`);
                g.addColorStop(1, 'rgba(20, 20, 24, 0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(0, 0, 1, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            };

            drawBlob(256, 256, 170, 145, 0.34); // Bóng thân trung tâm
            drawBlob(145, 330, 58, 42, 0.45);   // Chân trước trái
            drawBlob(365, 330, 58, 42, 0.45);   // Chân trước phải
            drawBlob(155, 185, 52, 38, 0.38);   // Chân sau trái
            drawBlob(355, 185, 52, 38, 0.38);   // Chân sau phải

            return new THREE.CanvasTexture(canvas);
        }

        /**
         * Khởi tạo bộ vật liệu PBR
         */
        function initMaterials() {
            const armorTex = createArmorTextures();
            const legTex = createLegArmorTextures();

            materials = {
                // Giáp thân cầu trắng-đỏ có vết xước
                mainArmor: new THREE.MeshStandardMaterial({
                    map: armorTex.albedoMap,
                    roughnessMap: armorTex.roughnessMap,
                    bumpMap: armorTex.bumpMap,
                    bumpScale: 0.015,
                    roughness: 0.58,
                    metalness: 0.16
                }),
                // Giáp chân cong trắng-đỏ
                legArmor: new THREE.MeshStandardMaterial({
                    map: legTex.map,
                    bumpMap: legTex.bump,
                    bumpScale: 0.012,
                    roughness: 0.46,
                    metalness: 0.15
                }),
                // Nhựa/thép cơ khí xám đậm cho khớp & khung trong
                darkGunmetal: new THREE.MeshStandardMaterial({
                    color: 0x383a40,
                    roughness: 0.42,
                    metalness: 0.78
                }),
                // Lõi tối sâu bên trong hốc cơ khí
                innerCoreBlack: new THREE.MeshStandardMaterial({
                    color: 0x16171a,
                    roughness: 0.55,
                    metalness: 0.65
                }),
                // Kim loại thép không gỉ / Chrome sáng bóng (Pít-tông thủy lực & trục khớp)
                polishedChrome: new THREE.MeshStandardMaterial({
                    color: 0xe6e9ef,
                    roughness: 0.12,
                    metalness: 0.98
                }),
                // Sơn đỏ bóng kim loại cho nắp vây đỉnh đầu
                metallicRed: new THREE.MeshPhysicalMaterial({
                    color: 0xb81d1d,
                    roughness: 0.28,
                    metalness: 0.45,
                    clearcoat: 0.6,
                    clearcoatRoughness: 0.2
                }),
                // Đèn LED phát sáng cam-vàng rực rỡ (Mắt & khớp gối)
                emissiveOrange: new THREE.MeshStandardMaterial({
                    color: 0xff9d00,
                    emissive: 0xff6200,
                    emissiveIntensity: state.glowIntensity,
                    roughness: 0.2,
                    metalness: 0.1
                }),
                // Thấu kính mắt thủy tinh đen sâu phản chiếu
                eyeLensGlass: new THREE.MeshPhysicalMaterial({
                    color: 0x080606,
                    roughness: 0.04,
                    metalness: 0.15,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.02,
                    reflectivity: 1.0
                })
            };
        }

        /**
         * Xây dựng Khối Thân Cầu Chia Mảnh Giáp & Cụm Mắt Trung Tâm
         */
        function buildSphericalBody() {
            bodyGroup = new THREE.Group();
            const R = 1.02;

            // 1. Lõi cơ khí tối màu bên trong (lộ ra qua các khe giáp và hốc mắt)
            const coreGeo = new THREE.SphereGeometry(R * 0.87, 36, 36);
            const coreMesh = new THREE.Mesh(coreGeo, materials.innerCoreBlack);
            coreMesh.castShadow = true;
            bodyGroup.add(coreMesh);

            // Các vòng gân cơ khí & khe phát sáng cam ẩn bên trong khoang lõi hai bên mắt
            [-1, 1].forEach(side => {
                const ribGeo = new THREE.TorusGeometry(R * 0.86, 0.032, 12, 32, Math.PI * 0.7);
                const rib = new THREE.Mesh(ribGeo, materials.darkGunmetal);
                rib.position.set(side * 0.18, 0.05, 0.08);
                rib.rotation.y = side * 0.35;
                bodyGroup.add(rib);

                // Khe đèn lõi màu cam hắt sáng từ bên trong (giống ảnh mẫu!)
                const innerGlowGeo = new THREE.TorusGeometry(0.36, 0.022, 12, 32, Math.PI * 0.65);
                const innerGlow = new THREE.Mesh(innerGlowGeo, materials.emissiveOrange);
                innerGlow.position.set(side * 0.22, -0.02, 0.68);
                innerGlow.rotation.set(0, side * 0.42, side === 1 ? -Math.PI * 0.32 : Math.PI * 0.68);
                bodyGroup.add(innerGlow);
            });

            // 2. Các tấm vỏ giáp cầu chia mảnh (Segmented Spherical Shell Plates)
            // Sử dụng SphereGeometry với phiStart & phiLength để tạo khe hở cơ khí dọc chính giữa giống ảnh
            const createShellSegment = (phiStart, phiLength, thetaStart, thetaLength, radiusOffset = 0) => {
                const segGroup = new THREE.Group();
                const outerR = R + radiusOffset;
                const innerR = outerR - 0.085;

                // Mặt ngoài vỏ giáp
                const outerGeo = new THREE.SphereGeometry(outerR, 40, 32, phiStart, phiLength, thetaStart, thetaLength);
                const outerMesh = new THREE.Mesh(outerGeo, materials.mainArmor);
                outerMesh.castShadow = true;
                outerMesh.receiveShadow = true;
                segGroup.add(outerMesh);

                // Mặt trong dày dặn của tấm giáp
                const innerGeo = new THREE.SphereGeometry(innerR, 32, 24, phiStart, phiLength, thetaStart, thetaLength);
                const innerMat = materials.darkGunmetal.clone();
                innerMat.side = THREE.BackSide;
                const innerMesh = new THREE.Mesh(innerGeo, innerMat);
                segGroup.add(innerMesh);

                return segGroup;
            };

            // Mặt trước của SphereGeometry nằm ở góc phi = PI/2 (trục +Z)
            // Tạo khe hở dọc ở chính giữa đỉnh đầu và cằm (chừa khoảng trống ~0.16 rad ở phi = PI/2)
            const frontPhi = Math.PI / 2;
            const gapHalf = 0.085;

            // Mảnh giáp lớn bên Trái (nhìn từ trước)
            const leftMainPlate = createShellSegment(
                frontPhi + gapHalf,
                Math.PI * 0.86,
                0.18,
                Math.PI - 0.38,
                0.01
            );
            bodyGroup.add(leftMainPlate);

            // Mảnh giáp lớn bên Phải (nhìn từ trước)
            const rightMainPlate = createShellSegment(
                frontPhi - gapHalf - Math.PI * 0.86,
                Math.PI * 0.86,
                0.18,
                Math.PI - 0.38,
                0.01
            );
            bodyGroup.add(rightMainPlate);

            // Hai tai / gờ giáp nổi cao tạo khe rãnh cơ khí trên đỉnh đầu (giống 2 gờ trắng vươn lên ở đỉnh ảnh mẫu)
            [-1, 1].forEach(side => {
                const crestPhi = side === -1 ? frontPhi + 0.11 : frontPhi - 0.56;
                const crestPlate = createShellSegment(crestPhi, 0.45, 0.14, 0.72, 0.048);
                bodyGroup.add(crestPlate);
            });

            // Mảnh giáp lưng phía sau & đáy gầm
            const backPlate = createShellSegment(frontPhi + Math.PI - 0.42, 0.84, 0.25, Math.PI - 0.5, 0.0);
            bodyGroup.add(backPlate);

            const bottomCap = createShellSegment(0, Math.PI * 2, Math.PI - 0.42, 0.35, -0.01);
            bodyGroup.add(bottomCap);

            // 3. Chi tiết Vây / Nắp giáp đỏ trên trục pít-tông nhô lên ở khe đỉnh đầu
            topAntennaGroup = new THREE.Group();
            topAntennaGroup.position.set(0, R + 0.02, 0.08);

            // Thanh trục pít-tông kim loại nâng nắp giáp đỏ
            const strutGeo = new THREE.CylinderGeometry(0.022, 0.026, 0.28, 16);
            const strut = new THREE.Mesh(strutGeo, materials.darkGunmetal);
            strut.position.set(0.04, 0.06, -0.02);
            strut.rotation.z = -0.08;
            topAntennaGroup.add(strut);

            const chromePinGeo = new THREE.CylinderGeometry(0.014, 0.014, 0.18, 16);
            const chromePin = new THREE.Mesh(chromePinGeo, materials.polishedChrome);
            chromePin.position.set(-0.03, 0.08, 0.02);
            topAntennaGroup.add(chromePin);

            // Nắp giáp mũi nhọn màu đỏ bóng ở đỉnh
            const finShape = new THREE.Shape();
            finShape.moveTo(0, 0.14);
            finShape.lineTo(0.18, 0.02);
            finShape.lineTo(0.12, -0.14);
            finShape.lineTo(-0.12, -0.14);
            finShape.lineTo(-0.18, 0.02);
            finShape.closePath();

            const finGeo = new THREE.ExtrudeGeometry(finShape, {
                depth: 0.045,
                bevelEnabled: true,
                bevelSegments: 3,
                bevelSize: 0.012,
                bevelThickness: 0.012
            });
            finGeo.rotateX(Math.PI / 2 + 0.12);
            finGeo.center();

            topFinMesh = new THREE.Mesh(finGeo, materials.metallicRed);
            topFinMesh.position.set(0, 0.21, 0.02);
            topFinMesh.castShadow = true;
            topAntennaGroup.add(topFinMesh);

            bodyGroup.add(topAntennaGroup);

            // 4. Cụm Mắt Trung Tâm Phát Sáng (Glowing Core Eye Assembly)
            eyeAssembly = new THREE.Group();
            eyeAssembly.position.set(0, -0.03, R - 0.06);

            // Hốc vành ngoài màu trắng xám dày ôm quanh ống kính
            const outerHousingGeo = new THREE.TorusGeometry(0.28, 0.055, 24, 48);
            const outerHousing = new THREE.Mesh(outerHousingGeo, materials.mainArmor);
            outerHousing.castShadow = true;
            outerHousing.receiveShadow = true;
            eyeAssembly.add(outerHousing);

            // Vành cơ khí bậc thang màu xám súng (Gunmetal Bezel)
            const midBezelGeo = new THREE.CylinderGeometry(0.245, 0.265, 0.12, 40);
            midBezelGeo.rotateX(Math.PI / 2);
            const midBezel = new THREE.Mesh(midBezelGeo, materials.darkGunmetal);
            midBezel.position.z = 0.02;
            eyeAssembly.add(midBezel);

            // Vành kim loại chrome mảnh bên trong
            const innerRimGeo = new THREE.TorusGeometry(0.185, 0.014, 16, 40);
            const innerRim = new THREE.Mesh(innerRimGeo, materials.polishedChrome);
            innerRim.position.z = 0.082;
            eyeAssembly.add(innerRim);

            // Vòng LED phát sáng cam vàng rực rỡ (Emissive Ring)
            const ledRingGeo = new THREE.TorusGeometry(0.155, 0.021, 20, 48);
            const ledRing = new THREE.Mesh(ledRingGeo, materials.emissiveOrange);
            ledRing.position.z = 0.086;
            eyeAssembly.add(ledRing);

            // Thấu kính trung tâm đen bóng phản chiếu ánh sáng
            const lensGeo = new THREE.SphereGeometry(0.145, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.48);
            lensGeo.rotateX(Math.PI / 2);
            const lens = new THREE.Mesh(lensGeo, materials.eyeLensGlass);
            lens.position.z = 0.055;
            eyeAssembly.add(lens);

            // Đèn điểm màu cam ấm chiếu nhẹ lên vùng hốc quanh mắt
            const eyePointLight = new THREE.PointLight(0xff7700, 1.4, 2.2);
            eyePointLight.position.set(0, 0, 0.25);
            eyeAssembly.add(eyePointLight);

            bodyGroup.add(eyeAssembly);

            return bodyGroup;
        }

        /**
         * Tạo một Chân Cơ Khí kiểu Nhện kèm khớp gối phát sáng & pít-tông thủy lực
         */
        function buildSingleLeg(angleY, isFront) {
            // Pivot vai gắn vào hông thân cầu
            const hipPivot = new THREE.Group();
            const hipRadius = 0.88;
            hipPivot.position.set(
                Math.sin(angleY) * hipRadius,
                -0.18,
                Math.cos(angleY) * hipRadius
            );
            hipPivot.rotation.y = angleY;

            // 1. Cụm khớp vai (Hip Joint)
            const hipSocketGeo = new THREE.CylinderGeometry(0.18, 0.20, 0.24, 24);
            hipSocketGeo.rotateZ(Math.PI / 2);
            const hipSocket = new THREE.Mesh(hipSocketGeo, materials.darkGunmetal);
            hipSocket.castShadow = true;
            hipPivot.add(hipSocket);

            // Cánh tay đòn đùi (Upper Thigh Strut) vươn ra ngoài
            const thighGroup = new THREE.Group();
            const thighBarGeo = new THREE.BoxGeometry(0.18, 0.16, 0.56);
            const thighBar = new THREE.Mesh(thighBarGeo, materials.darkGunmetal);
            thighBar.position.set(0, 0.04, 0.26);
            thighBar.rotation.x = -0.18;
            thighBar.castShadow = true;
            thighGroup.add(thighBar);

            // Ốp cơ khí phụ hai bên đùi
            const sidePlateGeo = new THREE.BoxGeometry(0.24, 0.11, 0.36);
            const sidePlate = new THREE.Mesh(sidePlateGeo, materials.innerCoreBlack);
            sidePlate.position.set(0, 0.05, 0.24);
            sidePlate.rotation.x = -0.18;
            thighGroup.add(sidePlate);

            hipPivot.add(thighGroup);

            // 2. Cụm Khớp Gối Tròn Lớn có Vòng LED Cam Vàng (Knee Joint)
            const kneePivot = new THREE.Group();
            kneePivot.position.set(0, 0.10, 0.54);

            // Trục xi-lanh khớp gối màu xám súng
            const kneeDrumGeo = new THREE.CylinderGeometry(0.185, 0.185, 0.26, 32);
            kneeDrumGeo.rotateZ(Math.PI / 2);
            const kneeDrum = new THREE.Mesh(kneeDrumGeo, materials.darkGunmetal);
            kneeDrum.castShadow = true;
            kneePivot.add(kneeDrum);

            // Nắp tròn kim loại & Vòng LED cam mảnh ở 2 mặt bên khớp gối (giống hệt ảnh mẫu!)
            [-1, 1].forEach(side => {
                const capGeo = new THREE.CylinderGeometry(0.125, 0.125, 0.03, 28);
                capGeo.rotateZ(Math.PI / 2);
                const cap = new THREE.Mesh(capGeo, materials.darkGunmetal);
                cap.position.x = side * 0.135;
                kneePivot.add(cap);

                // Vòng đèn LED cam chia đoạn quanh nắp khớp gối
                for (let s = 0; s < 3; s++) {
                    const segArc = new THREE.TorusGeometry(0.145, 0.011, 10, 20, Math.PI * 0.52);
                    const segMesh = new THREE.Mesh(segArc, materials.emissiveOrange);
                    segMesh.rotation.y = Math.PI / 2;
                    segMesh.rotation.x = s * ((Math.PI * 2) / 3) + 0.2;
                    segMesh.position.x = side * 0.132;
                    kneePivot.add(segMesh);
                }
            });

            // 3. Tấm Giáp Ống Chân Cong Lớn (Curved Lower Leg Armor Shield)
            const shinGroup = new THREE.Group();

            // Tạo hình dạng cánh cung dày của giáp ống chân bằng ExtrudeGeometry
            const legShape = new THREE.Shape();
            legShape.moveTo(-0.08, 0.26);
            legShape.quadraticCurveTo(0.28, 0.28, 0.34, -0.18);
            legShape.quadraticCurveTo(0.36, -0.58, 0.14, -0.88);
            legShape.lineTo(0.02, -0.84);
            legShape.quadraticCurveTo(0.16, -0.52, 0.12, -0.16);
            legShape.quadraticCurveTo(0.08, 0.08, -0.10, 0.10);
            legShape.closePath();

            const legArmorGeo = new THREE.ExtrudeGeometry(legShape, {
                depth: 0.34,
                bevelEnabled: true,
                bevelSegments: 5,
                steps: 1,
                bevelSize: 0.028,
                bevelThickness: 0.035,
                curveSegments: 24
            });
            legArmorGeo.center();
            // Xoay để mặt cong hướng ra ngoài theo trục +Z của chân
            legArmorGeo.rotateY(-Math.PI / 2);

            const shinArmorMesh = new THREE.Mesh(legArmorGeo, materials.legArmor);
            shinArmorMesh.position.set(0, -0.34, 0.14);
            shinArmorMesh.castShadow = true;
            shinArmorMesh.receiveShadow = true;
            shinGroup.add(shinArmorMesh);

            // Khung xương kim loại bên trong ống chân
            const innerShinGeo = new THREE.BoxGeometry(0.16, 0.72, 0.14);
            const innerShin = new THREE.Mesh(innerShinGeo, materials.darkGunmetal);
            innerShin.position.set(0, -0.38, 0.04);
            innerShin.rotation.x = 0.12;
            innerShin.castShadow = true;
            shinGroup.add(innerShin);

            // Khớp cổ chân tròn có rãnh vít & Bàn chân móng vuốt kim loại chạm sàn
            const ankleDrumGeo = new THREE.CylinderGeometry(0.11, 0.11, 0.24, 24);
            ankleDrumGeo.rotateZ(Math.PI / 2);
            const ankleDrum = new THREE.Mesh(ankleDrumGeo, materials.darkGunmetal);
            ankleDrum.position.set(0, -0.74, -0.02);
            shinGroup.add(ankleDrum);

            const footClawGeo = new THREE.BoxGeometry(0.17, 0.15, 0.24);
            const footClaw = new THREE.Mesh(footClawGeo, materials.darkGunmetal);
            footClaw.position.set(0, -0.86, 0.0);
            footClaw.castShadow = true;
            footClaw.receiveShadow = true;
            shinGroup.add(footClaw);

            // Điểm neo gắn đầu pít-tông thủy lực trên ống chân
            const shinPistonAnchor = new THREE.Object3D();
            shinPistonAnchor.position.set(0, -0.66, -0.05);
            shinGroup.add(shinPistonAnchor);

            kneePivot.add(shinGroup);
            hipPivot.add(kneePivot);

            return {
                hipPivot,
                kneePivot,
                shinPistonAnchor,
                baseAngleY: angleY,
                isFront
            };
        }

        /**
         * Tạo hệ thống Thanh Pít-tông Thủy Lực Kim Loại Sáng Bóng (Telescopic Hydraulic Struts)
         * Tự động co giãn và hướng chính xác giữa 2 điểm neo mỗi khung hình
         */
        function createHydraulicPiston(anchorA, anchorB) {
            // Ống xi-lanh ngoài (Outer Barrel - thép chrome hơi tối hơn một chút)
            const barrelGroup = new THREE.Group();
            const barrelGeo = new THREE.CylinderGeometry(0.036, 0.036, 1, 16);
            barrelGeo.rotateX(Math.PI / 2);
            barrelGeo.translate(0, 0, 0.5);
            const barrelMesh = new THREE.Mesh(barrelGeo, materials.darkGunmetal);
            barrelMesh.castShadow = true;
            barrelGroup.add(barrelMesh);

            // Vòng cổ phớt kim loại sáng bóng ở đầu xi-lanh
            const collarGeo = new THREE.CylinderGeometry(0.044, 0.044, 0.06, 16);
            collarGeo.rotateX(Math.PI / 2);
            collarGeo.translate(0, 0, 0.96);
            const collarMesh = new THREE.Mesh(collarGeo, materials.polishedChrome);
            barrelGroup.add(collarMesh);

            // Khớp cầu gắn vào gầm thân
            const jointAGeo = new THREE.SphereGeometry(0.048, 16, 16);
            const jointA = new THREE.Mesh(jointAGeo, materials.darkGunmetal);
            barrelGroup.add(jointA);

            // Ty pít-tông trong (Inner Rod - Chrome sáng bóng như gương)
            const rodGroup = new THREE.Group();
            const rodGeo = new THREE.CylinderGeometry(0.023, 0.023, 1, 16);
            rodGeo.rotateX(Math.PI / 2);
            rodGeo.translate(0, 0, 0.5);
            const rodMesh = new THREE.Mesh(rodGeo, materials.polishedChrome);
            rodMesh.castShadow = true;
            rodGroup.add(rodMesh);

            const jointB = new THREE.Mesh(jointAGeo, materials.polishedChrome);
            rodGroup.add(jointB);

            scene.add(barrelGroup);
            scene.add(rodGroup);

            pistonPairs.push({
                anchorA,
                anchorB,
                barrelGroup,
                rodGroup
            });
        }

        /**
         * Cập nhật vị trí và chiều dài của tất cả pít-tông thủy lực theo chuyển động của chân
         */
        function updateHydraulics() {
            const posA = new THREE.Vector3();
            const posB = new THREE.Vector3();

            pistonPairs.forEach(p => {
                p.anchorA.getWorldPosition(posA);
                p.anchorB.getWorldPosition(posB);

                const dist = posA.distanceTo(posB);

                // Xi-lanh ngoài chiếm 54% chiều dài từ gầm thân hướng ra chân
                p.barrelGroup.position.copy(posA);
                p.barrelGroup.lookAt(posB);
                p.barrelGroup.scale.set(1, 1, dist * 0.56);

                // Ty pít-tông chrome sáng bóng chiếm 58% chiều dài từ chân đâm ngược vào xi-lanh
                p.rodGroup.position.copy(posB);
                p.rodGroup.lookAt(posA);
                p.rodGroup.scale.set(1, 1, dist * 0.58);
            });
        }

        /**
         * Lắp ráp toàn bộ Robot Nhện Hình Cầu
         */
        function buildCompleteMech() {
            mechRoot = new THREE.Group();

            // Thân cầu trung tâm nâng lơ lửng ở độ cao y = 1.15
            const body = buildSphericalBody();
            body.position.set(0, 1.16, 0);
            mechRoot.add(body);

            // 4 góc đặt chân bất đối xứng nhẹ giống hệt tư thế bước đi trong ảnh mẫu
            const legConfigs = [
                { angle: -0.78, isFront: true },   // Chân trước bên trái
                { angle: 0.78, isFront: true },    // Chân trước bên phải
                { angle: -2.28, isFront: false },  // Chân sau bên trái
                { angle: 2.28, isFront: false }    // Chân sau bên phải
            ];

            legConfigs.forEach(cfg => {
                const leg = buildSingleLeg(cfg.angle, cfg.isFront);
                body.add(leg.hipPivot);

                // Điểm neo pít-tông ở gầm dưới thân cầu
                const bodyAnchor = new THREE.Object3D();
                bodyAnchor.position.set(
                    Math.sin(cfg.angle) * 0.42,
                    -0.78,
                    Math.cos(cfg.angle) * 0.42
                );
                body.add(bodyAnchor);

                legSystems.push(leg);
                createHydraulicPiston(bodyAnchor, leg.shinPistonAnchor);
            });

            scene.add(mechRoot);
        }

        /**
         * Khởi tạo Scene, Camera, Ánh sáng Studio & Post-Processing Bloom
         */
        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene nền xám studio trung tính giống ảnh mẫu
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x9a9a9a);
            scene.fog = new THREE.Fog(0x9a9a9a, 12, 26);

            // 2. Camera góc 3/4 nhìn xuống nhẹ
            camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.copy(DEFAULT_CAM_POS);

            // 3. Renderer chất lượng cao
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.05;
            container.appendChild(renderer.domElement);

            // 4. Môi trường phản xạ kim loại Studio (PMREM + RoomEnvironment)
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            const envTexture = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
            scene.environment = envTexture;
            scene.environmentIntensity = state.envIntensity;

            // 5. Hệ thống đèn Studio
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x6e6e72, 0.85);
            hemiLight.position.set(0, 10, 0);
            scene.add(hemiLight);

            // Đèn chính chiếu từ trên chếch phải tạo bóng đổ mềm xuống sàn xám
            dirLight = new THREE.DirectionalLight(0xfffcf5, 1.55);
            dirLight.position.set(3.2, 6.8, 4.2);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 1;
            dirLight.shadow.camera.far = 16;
            const d = 3.0;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            dirLight.shadow.bias = -0.0004;
            dirLight.shadow.radius = 4;
            scene.add(dirLight);

            // Đèn phụ (Fill & Rim) làm nổi bật đường cong giáp & pít-tông chrome
            const fillLight = new THREE.DirectionalLight(0xeef4ff, 0.65);
            fillLight.position.set(-4.5, 3.0, 2.5);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
            rimLight.position.set(0, 4.0, -4.5);
            scene.add(rimLight);

            // 6. Sàn studio đồng màu nhận bóng đổ mềm + Contact Shadow
            const floorGeo = new THREE.PlaneGeometry(50, 50);
            const floorMat = new THREE.MeshStandardMaterial({
                color: 0x9a9a9a,
                roughness: 0.88,
                metalness: 0.05
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0.0;
            floor.receiveShadow = true;
            scene.add(floor);

            const contactTex = createContactShadowTexture();
            const contactMat = new THREE.MeshBasicMaterial({
                map: contactTex,
                transparent: true,
                depthWrite: false,
                opacity: 0.9
            });
            const contactPlane = new THREE.Mesh(new THREE.PlaneGeometry(3.8, 3.8), contactMat);
            contactPlane.rotation.x = -Math.PI / 2;
            contactPlane.position.y = 0.003;
            scene.add(contactPlane);

            // 7. Vật liệu & Dựng Robot
            initMaterials();
            buildCompleteMech();

            // 8. Hậu kỳ UnrealBloomPass tạo quầng sáng cam vàng ấm áp cho mắt và khớp gối
            const renderScene = new RenderPass(scene, camera);
            bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                0.42, // Strength nhẹ tinh tế không làm cháy nền xám
                0.55, // Radius tỏa sáng mềm
                0.88  // Threshold chỉ bắt các nguồn sáng emissive mạnh
            );
            const outputPass = new OutputPass();

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);
            composer.addPass(outputPass);

            // 9. OrbitControls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.copy(DEFAULT_CAM_TARGET);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.minDistance = 2.0;
            controls.maxDistance = 11.0;
            controls.maxPolarAngle = Math.PI / 2 - 0.02;
            controls.update();

            setupUIEvents();
            window.addEventListener('resize', onWindowResize);

            // Ẩn loader
            setTimeout(() => {
                const loader = document.getElementById('loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }
            }, 300);
        }

        /**
         * Sự kiện bảng điều khiển UI
         */
        function setupUIEvents() {
            const morphToggle = document.getElementById('morph-toggle');
            const idleToggle = document.getElementById('idle-toggle');
            const glowSlider = document.getElementById('glow-slider');
            const glowVal = document.getElementById('glow-val');
            const envSlider = document.getElementById('env-slider');
            const envVal = document.getElementById('env-val');
            const resetCamBtn = document.getElementById('reset-cam-btn');
            const togglePanelBtn = document.getElementById('toggle-panel-btn');
            const controlPanel = document.getElementById('control-panel');

            morphToggle.addEventListener('change', (e) => {
                state.morphSphere = e.target.checked;
            });

            idleToggle.addEventListener('change', (e) => {
                state.idleActive = e.target.checked;
            });

            glowSlider.addEventListener('input', (e) => {
                state.glowIntensity = parseFloat(e.target.value);
                glowVal.textContent = state.glowIntensity.toFixed(1);
                materials.emissiveOrange.emissiveIntensity = state.glowIntensity;
            });

            envSlider.addEventListener('input', (e) => {
                state.envIntensity = parseFloat(e.target.value);
                envVal.textContent = state.envIntensity.toFixed(2);
                scene.environmentIntensity = state.envIntensity;
                dirLight.intensity = 1.35 * state.envIntensity;
            });

            resetCamBtn.addEventListener('click', () => {
                camera.position.copy(DEFAULT_CAM_POS);
                controls.target.copy(DEFAULT_CAM_TARGET);
                controls.update();
            });

            togglePanelBtn.addEventListener('click', () => {
                controlPanel.classList.toggle('hidden');
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        /**
         * Vòng lặp hoạt ảnh động học & cập nhật thủy lực
         */
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // Chuyển đổi mượt mà giữa tư thế đứng (0) và thu gọn thành khối cầu (1)
            const targetMorph = state.morphSphere ? 1 : 0;
            state.morphProgress = THREE.MathUtils.lerp(state.morphProgress, targetMorph, 0.07);
            const m = state.morphProgress;

            // Hiệu ứng nhún thở thủy lực & quét mắt khi bật Idle
            const breathe = state.idleActive && m < 0.5 ? Math.sin(t * 2.2) * 0.035 : 0;
            const swayY = state.idleActive && m < 0.5 ? Math.sin(t * 1.1) * 0.04 : 0;

            if (bodyGroup) {
                // Hạ thấp thân cầu khi thu gọn thành quả cầu lăn
                bodyGroup.position.y = THREE.MathUtils.lerp(1.16 + breathe, 1.04, m);
                bodyGroup.rotation.y = swayY;
                bodyGroup.rotation.z = state.idleActive && m < 0.5 ? Math.cos(t * 1.1) * 0.015 : 0;
            }

            // Nắp vây đỏ trên đỉnh đầu thụt vào trong khi biến hình thành khối cầu
            if (topAntennaGroup) {
                const antennaPulse = state.idleActive ? Math.sin(t * 3.0) * 0.015 : 0;
                topAntennaGroup.position.y = THREE.MathUtils.lerp(1.04 + antennaPulse, 0.82, m);
            }

            // Đảo mắt camera nhẹ nhàng quan sát xung quanh
            if (eyeAssembly) {
                if (state.idleActive && m < 0.5) {
                    eyeAssembly.rotation.y = Math.sin(t * 1.4) * 0.14;
                    eyeAssembly.rotation.x = Math.cos(t * 1.9) * 0.08;
                } else {
                    eyeAssembly.rotation.y = THREE.MathUtils.lerp(eyeAssembly.rotation.y, 0, 0.1);
                    eyeAssembly.rotation.x = THREE.MathUtils.lerp(eyeAssembly.rotation.x, 0, 0.1);
                }
            }

            // Động học 4 chân & khớp gối bù trừ theo nhịp nhún của thân
            legSystems.forEach((leg, idx) => {
                const phase = idx % 2 === 0 ? 0 : Math.PI;
                const walkOffset = state.idleActive && m < 0.3 ? Math.sin(t * 2.2 + phase) * 0.025 : 0;

                // Khi thu gọn thành khối cầu (m = 1), 4 tấm giáp chân ôm sát vào đường cong thân cầu
                const standHipX = -0.08 - breathe * 0.65 + walkOffset;
                const sphereHipX = 0.52;
                leg.hipPivot.rotation.x = THREE.MathUtils.lerp(standHipX, sphereHipX, m);

                const standKneeX = 0.08 + breathe * 0.85 - walkOffset;
                const sphereKneeX = -0.68;
                leg.kneePivot.rotation.x = THREE.MathUtils.lerp(standKneeX, sphereKneeX, m);
            });

            // Cập nhật toàn bộ 4 thanh pít-tông thủy lực chrome sáng bóng
            updateHydraulics();

            controls.update();
            composer.render();
        }

        window.onload = function () {
            init();
            animate();
        };
    </script>
</body>
</html>
